<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services — Availability & Merchandising Prototype</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0ede8;--white:#fff;--text:#222;--muted:#717171;--hint:#b0b0b0;
  --border:#e0e0e0;--light:#ebebeb;--surface:#f7f7f7;--pink:#FF385C;
  --green:#008A6E;--sm:8px;--md:12px;--lg:16px;--pill:30px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#c4bfba 1px,transparent 1px);background-size:22px 22px;opacity:.18;pointer-events:none;z-index:0}

/* ── Page chrome ── */
.hdr{background:var(--white);border-bottom:1px solid var(--light);padding:13px 28px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.logo{font-size:21px;font-weight:800;color:var(--pink);letter-spacing:-.5px}
.meta{font-size:11px;color:var(--muted);text-align:right;line-height:1.6}
.meta strong{color:var(--text);font-weight:600}

/* ── Layout ── */
.layout{display:flex;gap:18px;max-width:960px;margin:24px auto;padding:0 18px;align-items:flex-start;position:relative;z-index:1}

/* ── Sidebar ── */
.sidebar{width:168px;flex-shrink:0;position:sticky;top:18px}
.slabel{font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin:13px 0 4px 3px}
.slabel:first-child{margin-top:0}
.sbtn{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:7px 8px;font-size:12px;background:none;border:1px solid transparent;border-radius:var(--sm);cursor:pointer;color:var(--muted);margin-bottom:1px;font-family:inherit;line-height:1.3;transition:all .12s}
.sbtn:hover{background:var(--white);color:var(--text)}
.sbtn.on{background:var(--white);border-color:var(--border);color:var(--text);font-weight:600}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-out{background:var(--pink)}.d-in{background:#1D9E75}

/* ── Phone ── */
.phone-col{flex:1;display:flex;justify-content:center}
.phone{width:310px;background:var(--white);border-radius:42px;border:2px solid #c8c8c8;overflow:hidden;box-shadow:0 14px 50px rgba(0,0,0,.14);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:var(--text)}
.pstat{padding:14px 20px 4px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:#111}
.spill{margin:3px 13px 9px;background:var(--white);border-radius:var(--pill);padding:9px 13px;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);border:1px solid var(--border);box-shadow:0 1px 5px rgba(0,0,0,.05)}
.tabrow{display:flex;gap:5px;padding:0 13px 10px;overflow:hidden}
.ptab{padding:6px 10px;font-size:12px;font-weight:500;border-radius:var(--pill);border:1px solid var(--border);background:var(--white);color:var(--muted);white-space:nowrap;cursor:pointer;font-family:inherit;transition:all .12s}
.ptab.on{background:var(--white);border-color:var(--text);color:var(--text);font-weight:700}
.screen{padding:0 13px 22px;max-height:580px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.screen::-webkit-scrollbar{display:none}

/* ── Section headers ── */
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin:16px 0 9px}
.st{font-size:17px;font-weight:700;color:var(--text)}.ss{font-size:13px;color:var(--muted);margin-top:2px}
.sa{width:29px;height:29px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}

/* ── Service icon carousel ── */
.svc-row{display:flex;gap:9px;overflow:hidden}
.svc-chip{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0}
.chip-box{width:72px;height:72px;background:var(--surface);border-radius:var(--md);display:flex;align-items:center;justify-content:center;border:1px solid var(--light);transition:background .12s;overflow:hidden}
.chip-box img,.chip-box .chi{width:48px;height:48px;object-fit:contain}
.chip-box .chi{font-size:32px;line-height:1;display:flex;align-items:center;justify-content:center}
.svc-chip:hover .chip-box{background:#efefef}
.svc-chip span{font-size:11px;color:var(--muted);text-align:center}

/* ── Essential service row ── */
.esrow{display:flex;align-items:center;padding:10px 11px;background:var(--surface);border-radius:var(--md);margin-bottom:7px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.esrow:hover{background:#efefef}
.esico{width:44px;height:44px;background:var(--white);border-radius:9px;display:flex;align-items:center;justify-content:center;margin-right:11px;flex-shrink:0;font-size:20px;border:1px solid var(--light)}
.estxt{flex:1}.esn{font-size:13px;font-weight:500;color:var(--text)}.ess{font-size:11px;color:var(--muted);margin-top:1px}
.esth{width:44px;height:44px;border-radius:9px;background:#e8e4df;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}

/* ── Photo cards ── */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pcard{border-radius:11px;overflow:hidden;cursor:pointer}
.pcimg{width:100%;height:110px;border-radius:11px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.badge{position:absolute;top:7px;left:7px;background:rgba(255,255,255,.92);color:var(--text);font-size:10px;font-weight:700;padding:3px 7px;border-radius:20px}
.hrt{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center}
.pcinfo{padding:6px 1px 0}.pcn{font-size:12px;font-weight:500;color:var(--text);line-height:1.3}.pcp{font-size:11px;color:var(--muted);margin-top:1px}

/* ── Recently viewed ── */
.rvrow{display:flex;gap:9px;overflow:hidden}
.rvcard{flex-shrink:0;width:86px}
.rvimg{width:86px;height:78px;border-radius:9px;background:#e8e4df;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.rvn{font-size:11px;font-weight:500;color:var(--text);margin-top:4px;line-height:1.3}.rvh{font-size:10px;color:var(--muted)}

/* ── Continue search card ── */
.cont{background:var(--white);border:1px solid var(--light);border-radius:var(--lg);padding:12px;margin-bottom:4px;display:flex;align-items:center;gap:11px;cursor:pointer}
.cont-th{width:54px;height:54px;border-radius:9px;background:#e8e4df;flex-shrink:0;font-size:22px;display:flex;align-items:center;justify-content:center}
.cont h4{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;line-height:1.3}.cont p{font-size:11px;color:var(--muted)}

/* ── Inline car spotlight card ── */
.car-inline{background:var(--surface);border-radius:var(--lg);padding:11px 12px;margin-bottom:4px;display:flex;align-items:center;gap:10px;border:1px solid var(--light);cursor:pointer;transition:background .12s}
.car-inline:hover{background:#efefef}
.ci-ico{font-size:32px;flex-shrink:0}
.ci-txt h4{font-size:13px;font-weight:600;color:var(--text);margin-bottom:1px}.ci-txt p{font-size:11px;color:var(--muted)}
.ci-btn{margin-left:auto;padding:6px 11px;background:var(--white);border:1px solid var(--border);border-radius:var(--pill);font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0}

/* ── XL Spotlight ── */
.xl{background:var(--surface);border-radius:var(--lg);padding:20px 14px 16px;margin-bottom:4px;text-align:center;border:1px solid var(--light)}
.xl-illo{font-size:70px;display:block;margin-bottom:10px;line-height:1}
.xl-title{font-size:19px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:5px}
.xl-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.xl-btn{display:block;width:100%;padding:12px;background:var(--white);color:var(--text);border-radius:var(--pill);font-size:14px;font-weight:500;border:1px solid var(--border);cursor:pointer;font-family:inherit;transition:background .12s}
.xl-btn:hover{background:#efefef}

/* ── Bottom nav ── */
.botnav{border-top:1px solid var(--light);padding:8px 0 6px;display:flex;justify-content:space-around;background:var(--white)}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:500;color:var(--muted)}
.bn.on{color:var(--pink)}

/* ── Modal interstitial (centered, not sheet) ── */
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal{background:var(--white);border-radius:20px;padding:20px 18px 22px;width:100%;position:relative}
.modal-x{position:absolute;top:12px;right:12px;width:28px;height:28px;background:#f0f0f0;border:none;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:inherit;color:var(--text)}
.modal-x:hover{background:#e4e4e4}
.modal-car{font-size:72px;text-align:center;display:block;margin:4px 0 10px;line-height:1}
.credit-pill{display:inline-block;background:#E8F5E9;color:#1B5E20;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:10px}
.modal-title{font-size:22px;font-weight:700;color:var(--text);text-align:center;line-height:1.2;margin-bottom:5px}
.modal-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:14px}
.modal-ctx{font-size:11px;color:var(--hint);text-align:center;margin-top:-8px;margin-bottom:12px}
.btn-blk{display:block;width:100%;padding:14px;background:var(--text);color:var(--white);border-radius:var(--pill);font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit;margin-bottom:8px;transition:background .12s}
.btn-blk:hover{background:#333}
.modal-legal{font-size:10px;color:var(--hint);text-align:center;line-height:1.5;margin-top:6px}

/* ── Fullscreen overlays ── */
.fullscreen{position:absolute;inset:0;z-index:20;background:var(--white);overflow-y:auto}

/* Login */
.login-wrap{padding:18px 16px 24px}
.login-close{float:right;width:28px;height:28px;background:#f0f0f0;border:none;border-radius:50%;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text)}
.login-logo{font-size:32px;color:var(--pink);text-align:center;margin:10px 0 14px;display:block}
.login-title{font-size:20px;font-weight:700;color:var(--text);text-align:center;margin-bottom:16px}
.login-input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:var(--md);font-size:14px;font-family:inherit;margin-bottom:11px;outline:none;color:var(--text)}
.login-input:focus{border-color:#888}
.divider{text-align:center;font-size:12px;color:var(--muted);margin:10px 0}
.social-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--md);font-size:13px;font-weight:500;background:var(--white);cursor:pointer;margin-bottom:7px;font-family:inherit;color:var(--text)}

/* OTP */
.otp-wrap{padding:18px 16px 24px}
.otp-back{background:none;border:none;font-size:18px;cursor:pointer;margin-bottom:14px;display:block;color:var(--text)}
.otp-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:5px}
.otp-sub{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.otp-boxes{display:flex;gap:7px;margin-bottom:14px}
.otp-box{flex:1;height:50px;border:1.5px solid var(--border);border-radius:var(--sm);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;color:var(--text)}
.otp-box.f{border-color:var(--text)}
.otp-resend{font-size:12px;color:var(--muted);margin-bottom:12px}
.otp-resend a{color:var(--text);text-decoration:underline;cursor:pointer}
.try-btn{display:block;width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--pill);font-size:14px;font-weight:500;background:var(--white);cursor:pointer;font-family:inherit;margin-bottom:9px;color:var(--text)}

/* Loading */
.loading-screen{position:absolute;inset:0;z-index:25;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:30px;height:30px;border:2px solid var(--light);border-top-color:var(--text);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Webview */
.webview{position:absolute;inset:0;z-index:26;background:var(--white);overflow-y:auto}
.wv-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 13px 10px;border-bottom:1px solid var(--light);position:sticky;top:0;background:var(--white)}
.wv-exit{padding:5px 13px;border:1px solid var(--border);border-radius:var(--pill);font-size:13px;font-weight:500;background:var(--white);cursor:pointer;font-family:inherit;color:var(--text)}
.wv-title{font-size:15px;font-weight:600;color:var(--text)}
.wv-body{padding:12px 13px 20px}
.wv-search{display:flex;align-items:flex-start;gap:8px;background:var(--surface);border-radius:20px;padding:11px 14px;margin-bottom:11px;border:1px solid var(--light)}
.wv-search-ico{flex-shrink:0;margin-top:2px;color:var(--muted)}
.wv-search-txt{font-size:13px;font-weight:500;color:var(--text);line-height:1.3}
.wv-search-sub{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:4px;padding:7px 12px;border:none;border-radius:var(--pill);font-size:12px;font-weight:600;background:var(--text);color:var(--white);cursor:pointer;font-family:inherit}
.chip.light{background:var(--white);color:var(--text);border:1px solid var(--border)}
.credit-box{background:var(--white);border:1px solid var(--light);border-radius:var(--lg);padding:13px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.credit-box-txt p{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.credit-box-txt span{font-size:12px;color:var(--muted)}
.credit-box-txt a{color:var(--text);text-decoration:underline}
.credit-tag{font-size:28px}
.car-card{background:var(--white);border:1px solid var(--light);border-radius:var(--lg);padding:12px;margin-bottom:10px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;transition:border-color .12s}
.car-card:hover{border-color:var(--border)}
.car-photo{width:80px;height:58px;background:#f4f0ec;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.car-photo img{width:100%;height:100%;object-fit:contain}
.car-photo .cph{font-size:32px}
.car-info{flex:1;min-width:0}
.brand-logo{font-size:11px;font-weight:800;letter-spacing:.05em;margin-bottom:3px}
.brand-sixt{color:#FF5A00}.brand-hertz{color:#FFD700;-webkit-text-stroke:1px #c8a000}
.car-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.car-sim{font-size:12px;color:var(--muted);margin-bottom:3px}
.car-detail{font-size:11px;color:var(--muted);margin-bottom:5px;line-height:1.4}
.car-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.ctag{font-size:10px;font-weight:500;padding:3px 7px;border-radius:4px;background:var(--surface);color:var(--muted);border:1px solid var(--light)}
.ctag.green{background:#E8F5E9;color:#1B5E20;border-color:#A5D6A7}
.car-price{font-size:13px;font-weight:700;color:var(--text);margin-top:2px}
.car-orig{font-size:12px;color:var(--muted);text-decoration:line-through;margin-right:4px}

/* Email screen */
.email-screen{background:var(--white);position:absolute;inset:0;z-index:5;overflow-y:auto}
.email-hdr{border-bottom:1px solid var(--light);padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.8}
.email-hdr a{color:var(--pink)}
.email-body{padding:16px 14px}
.email-airbnb{font-size:20px;color:var(--pink);margin-bottom:12px;display:block}
.email-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.3}
.email-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.email-cta{display:block;width:100%;padding:13px;background:var(--pink);color:var(--white);border-radius:var(--pill);font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit;text-align:center}

/* Trips tab */
.trips-hdr{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 13px 4px}
.trips-city{font-size:22px;font-weight:700;color:var(--text)}
.trips-sub{font-size:14px;color:var(--muted);margin-top:1px}
.trip-card{margin:0 13px 13px;border-radius:var(--lg);overflow:hidden;border:1px solid var(--light);cursor:pointer}
.trip-photo{width:100%;height:136px;background:linear-gradient(135deg,#7a9e50,#4a6e2a);display:flex;align-items:center;justify-content:center;position:relative}
.trip-label{position:absolute;top:9px;left:9px;background:var(--white);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--text)}
.trip-info{padding:12px 13px 13px;background:var(--white)}
.trip-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.trip-dates{font-size:12px;color:var(--muted);margin-bottom:9px}
.trip-avs{display:flex;align-items:center;gap:5px}
.av{width:25px;height:25px;border-radius:50%;border:2px solid var(--white);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.inv-btn{padding:6px 12px;border:1px solid var(--border);border-radius:var(--pill);font-size:11px;font-weight:500;background:var(--white);cursor:pointer;font-family:inherit}

/* Right panel */
.rpanel{width:182px;flex-shrink:0;position:sticky;top:18px}
.rcard{background:var(--white);border:1px solid var(--light);border-radius:var(--md);padding:11px;margin-bottom:9px}
.rcard h4{font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.fi{display:flex;align-items:flex-start;gap:7px;margin-bottom:7px;font-size:11px;color:var(--muted);line-height:1.4}
.fn{width:17px;height:17px;border-radius:50%;background:var(--surface);border:1px solid var(--border);font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;color:var(--text)}
.fn.cur{background:var(--text);color:var(--white);border-color:var(--text)}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;margin-bottom:7px}
.tag-out{background:#ffeef0;color:#c8002a}.tag-in{background:#e1f5ee;color:#085041}
.tommy-note{background:#FFFDE7;border:1px solid #FDD835;border-radius:var(--md);padding:10px;margin-bottom:9px}
.tommy-note h4{font-size:10px;font-weight:700;color:#F57F17;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.tommy-note p{font-size:11px;color:#5D4037;line-height:1.5}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">airbnb</div>
  <div class="meta"><strong>Services — Availability &amp; Merchandising</strong><br>Prototype · DRI: Daniel Delphin · v4</div>
</div>

<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="slabel">Null states</div>
    <button class="sbtn on" onclick="go('null-out')" id="b-null-out"><span class="sdot d-out"></span>Null — logged out</button>
    <button class="sbtn" onclick="go('null-in')" id="b-null-in"><span class="sdot d-in"></span>Null — logged in</button>
    <div class="slabel">Searched</div>
    <button class="sbtn" onclick="go('prev')" id="b-prev"><span class="sdot d-out"></span>Prev searched</button>
    <div class="slabel">Trip states</div>
    <button class="sbtn" onclick="go('no-trip')" id="b-no-trip"><span class="sdot d-in"></span>No trip booked</button>
    <button class="sbtn" onclick="go('trip')" id="b-trip"><span class="sdot d-in"></span>Trip booked</button>
    <button class="sbtn" onclick="go('xl')" id="b-xl"><span class="sdot d-in"></span>XL Spotlight</button>
    <button class="sbtn" onclick="go('after')" id="b-after"><span class="sdot d-in"></span>After booking</button>
    <button class="sbtn" onclick="go('during')" id="b-during"><span class="sdot d-in"></span>During trip</button>
    <button class="sbtn" onclick="go('rebook')" id="b-rebook"><span class="sdot d-in"></span>Book again</button>
    <div class="slabel">Entry points</div>
    <button class="sbtn" onclick="go('email')" id="b-email"><span class="sdot d-in"></span>Email / marketing</button>

  '<div class="chip">⚙ 2</div>'+
  '<div class="chip">Airports &nbsp;✕</div>'+
  '<div class="chip">Fits 4 people &nbsp;✕</div>'+
  '<div class="chip light">Location</div>'+
  '</div>'+
  '<div class="credit-box"><div class="credit-box-txt"><p>Get 20% in Airbnb credit</p><span>Use on stays, experiences, or select services. <a>Terms apply</a></span></div><div class="credit-tag">🏷️</div></div>'+
  carCard('SIXT','sixt','Medium SUV','BMW X3 or similar','7 seats · 3 bags · In terminal (MCO)',['Free cancellation'],'','$62/day','Total $248')+
  carCard('Hertz','hertz','Minivan','Dodge Grand Caravan or similar','7 seats · 3 bags · In terminal (MCO)',['15% off','Online check-in','+1 driver'],'$106','$94/day','Total $284')+
  carCard('Hertz','hertz','Elite SUV','Cadillac Escalade or similar','7 seats · 5 bags · In terminal (ORL)',['15% off','Online check-in'],'','','$94/day')+
  '</div>';
  scr.appendChild(d);
}

function carCard(brand,brandKey,name,sim,detail,tags,origPrice,price,total){
  var tagsHtml=tags.map(function(t){
    var cls=t==='Free cancellation'?'ctag green':(t==='15% off'?'ctag green':'ctag');
    return '<span class="'+cls+'">'+t+'</span>';
  }).join('');
  var orig=origPrice?'<span class="car-orig">'+origPrice+'</span>':'';
  var logoStyle=brandKey==='sixt'?'color:#FF5A00':'color:#c8a000';
  return '<div class="car-card">'+
  '<div class="car-photo"><div style="font-size:11px;font-weight:900;letter-spacing:.05em;'+logoStyle+'">'+brand.toUpperCase()+'</div></div>'+
  '<div class="car-info">'+
  '<div class="car-name">'+name+'</div>'+
  '<div class="car-sim">'+sim+'</div>'+
  '<div class="car-detail">'+detail+'</div>'+
  '<div class="car-tags">'+tagsHtml+'</div>'+
  '<div class="car-price">'+orig+price+' · '+total+'</div>'+
  '</div></div>';
}

// ── Flow config ──
var flows={
  'null-out':{loggedIn:false,steps:['Services tab','Tap Car rental','Modal opens','Tap Login & continue','Log in / OTP','→ Car rentals'],note:'Logged out. No partner/grocery services shown. Login prompt appears after modal CTA — not before.',tommy:'Null is not always logged out. This state covers logged-out users with no prior search.'},
  'null-in':{loggedIn:true,steps:['Services tab','Tap Car rental','Modal opens','Tap Continue','→ Car rentals'],note:'Logged in, no trip, no prior search. Same layout as logged-out null — no partner services shown.',tommy:'Null logged-in: someone with no past search and no trip. Same UI, but Continue goes straight to webview.'},
  'prev':{loggedIn:false,steps:['Services tab','Recent context shown','Tap Rental cars','Modal opens','Tap Login & continue','Log in / OTP','→ Car rentals'],note:'Location from recent search prefills context. Sign-in still deferred to after tapping Continue.',tommy:'"Prev Searched" might still be WIP — confirm with design whether this applies logged-in too.'},
  'no-trip':{loggedIn:true,steps:['Services tab','Tap Car rental','Modal opens (current location)','Tap Continue','→ Car rentals'],note:'Logged in, no trip. Modal opens with current location. Direct to webview — no login gate.'},
  'trip':{loggedIn:true,steps:['Services tab','Essential services list','Tap Rental cars','Modal (prefilled)','Tap Continue','→ Car rentals'],note:'Logged in with upcoming stay. Dates + location prefilled in modal. Direct to webview.'},
  'xl':{loggedIn:true,steps:['Services tab','XL Spotlight shown','Tap Start browsing','Modal opens','Tap Continue','→ Car rentals'],note:'Trip booked or came from marketing deep link. XL hero at top of Services tab.'},
  'after':{loggedIn:true,steps:['Post-booking','Complementary XL','Tap service','→ Webview'],note:'Upsell for complementary service shown after booking. No login gate.'},
  'during':{loggedIn:true,steps:['In-stay context','High-intent XL','Tap Order now','→ Webview'],note:'Active stay. Urgent same-day copy. Direct booking.'},
  'rebook':{loggedIn:true,steps:['Post-trip','Re-book XL','Tap Find new car','Modal','→ Car rentals'],note:'Last service resurfaces for re-booking. Logged in — no gate.'},
  'email':{loggedIn:true,steps:['Email/marketing CTA','Modal opens','Tap Continue','→ Car rentals','Close → Services tab with XL'],note:'Tapping email CTA opens interstitial. Tapping ✕ lands on Services tab with XL spotlight at top.'},
  'trips-tab':{loggedIn:true,steps:['Trips tab','Trip card shown','Tap service tile','Modal (prefilled)','Tap Continue','→ Car rentals'],note:'Trip context auto-prefills location + dates. Tapping service tile opens modal.'}
};

function setNavForState(key){
  var isTrips=key==='trips-tab';
  var isEmail=key==='email';
  var isLoggedOut=!flows[key].loggedIn&&key!=='null-in';
  document.getElementById('main-tabs').style.display=(isTrips||isEmail)?'none':'flex';
  document.getElementById('search-pill').style.display=isEmail?'none':'flex';
  document.querySelectorAll('.bn').forEach(function(b){b.classList.remove('on')});
  if(isTrips){document.getElementById('bn-trips').classList.add('on');}
  else{document.getElementById('bn-explore').classList.add('on');}
  var loginLbl=document.getElementById('bn-login-lbl');
  loginLbl.textContent=flows[key].loggedIn?'Profile':'Log in';
}

function renderFlow(){
  var f=flows[S];
  document.getElementById('flow-list').innerHTML=f.steps.map(function(s,i){
    return '<div class="fi"><div class="fn'+(i===step?' cur':'')+'">'+( i+1)+'</div><span>'+s+'</span></div>';
  }).join('');
  document.getElementById('tag-area').innerHTML=f.loggedIn?'<span class="tag tag-in">Logged in</span>':'<span class="tag tag-out">Logged out</span>';
  document.getElementById('note-txt').textContent=f.note;
  var tb=document.getElementById('tommy-box');
  var tt=document.getElementById('tommy-txt');
  if(f.tommy){tb.style.display='block';tt.textContent=f.tommy;}
  else{tb.style.display='none';}
}

function go(key){
  S=key;step=0;
  document.querySelectorAll('.sbtn').forEach(function(b){b.classList.remove('on')});
  document.getElementById('b-'+key).classList.add('on');
  setNavForState(key);
  var html=screens[key]();
  document.getElementById('scr').innerHTML=html;
  document.getElementById('scr').dataset.orig=html;
  renderFlow();
}

go('null-out');
</script>
